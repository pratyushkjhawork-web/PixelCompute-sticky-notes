<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sticky Notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Text&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <h1>Sticky Notes</h1>

    <form class="note-form" id="note-form">
      <label class="visually-hidden" for="note-input">Type a new note</label>
      <textarea id="note-input" placeholder="Type a new note..." rows="4" required></textarea>
      <button class="add-button" type="submit" aria-label="Add note" title="Add note">+</button>
    </form>

    <section class="notes-section" aria-label="Your sticky notes">
      <div class="notes-grid" id="notes-grid"></div>
      <p class="empty-message" id="empty-message">Your notes will appear here.</p>
    </section>
  </main>
</body>
</html>
